version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: eduptmdb
      POSTGRES_USER: ptmuser
      POSTGRES_PASSWORD: ptmpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn ptm_core.wsgi:application --bind 0.0.0.0:8000"
    environment:
      - DATABASE_URL=postgres://ptmuser:ptmpassword@db:5432/eduptmdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    command: celery -A ptm_core worker --loglevel=info
    environment:
      - DATABASE_URL=postgres://ptmuser:ptmpassword@db:5432/eduptmdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
    depends_on:
      - db
      - redis
      - backend


volumes:
  postgres_data:
